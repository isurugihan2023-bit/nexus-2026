# ninjanexus.duckdns.org — reverse proxy to the Nexus bot dashboard on
# Bot-Hosting.net (157.90.181.183:23063).
# Install: copy to /etc/nginx/sites-available/ninjanexus, symlink to
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# The bot itself stays on plain HTTP (the panel gives one port, no TLS);
# HTTPS terminates here on the website host, which also keeps the Discord
# OAuth2 redirect safe (Discord requires https:// redirect URIs — see notes
# at the bottom). No secrets in this file.

upstream nexus_bot {
    server 157.90.181.183:23063;
    keepalive 16;
}

server {
    listen 80;
    server_name ninjanexus.duckdns.org;
    # Certbot / existing TLS setup owns port 443; keep this to redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ninjanexus.duckdns.org;

    # ssl_certificate / ssl_certificate_key managed by certbot (unchanged).
    # ssl_certificate /etc/letsencrypt/live/ninjanexus.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ninjanexus.duckdns.org/privkey.pem;

    # --- Security headers (static files + proxied API alike) ---
    # No includeSubDomains/preload on HSTS: free duckdns.org subdomain.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://cdn.discordapp.com https://media.discordapp.net https://ui-avatars.com https://i.scdn.co; connect-src 'self' https://discord.com https://ninjanexus.duckdns.org; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Website files (unchanged).
    # root /var/www/ninjanexus;
    # index index.html;

    # --- SSE live stream: long-lived, no buffering, generous timeouts ---
    # NOTE: the website never blocks rendering on this stream — it renders
    # from plain JSON first and only uses SSE for background updates, with a
    # 3s client-side connect timeout and a polling fallback.
    location = /api/public/live/stream {
        proxy_pass http://nexus_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Public + authed bot API through one prefix ---
    # Auth is enforced by the bot itself: /api/system*, /api/ai_health and all
    # /api/admin* / POST routes require a login token; only safe read-only
    # endpoints (stats, uptime via /api/health, total_commands inside stats,
    # leaderboard, voice_live, teamspeak/status, public/most-played) answer
    # without login. Nothing to allow/deny here per-endpoint.
    # NOTE: the website renders from the first JSON response and polls in
    # the background, so these timeouts stay tight (2-3s connect). A slow
    # bot must never hold the page: fail fast, serve stale, retry later.
    location /api/ {
        proxy_pass http://nexus_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }

    # --- Dashboard websocket console ---
    location /ws/ {
        proxy_pass http://nexus_bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
