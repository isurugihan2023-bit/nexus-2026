<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Nexus | Discord Server</title>
    <meta name="description" content="The ultimate anime and gaming community. Join Ninja Nexus to make friends, hang out, and have fun.">
    <meta property="og:title" content="Ninja Nexus | Discord Server">
    <meta property="og:description" content="The ultimate anime and gaming community. Join Ninja Nexus to make friends, hang out, and have fun.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#7C3AED">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ── Reset ─────────────────────────────────────── */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        section { scroll-margin-top: 90px; }

        /* ── Tokens ─────────────────────────────────────── */
        :root {
            --bg:       #0a0a0f;
            --bg2:      #0f0d1a;
            --bg3:      #151225;
            --border:   rgba(139,92,246,0.12);
            --border2:  rgba(139,92,246,0.25);
            --p400:     #a78bfa;
            --p500:     #8b5cf6;
            --p600:     #7c3aed;
            --p700:     #6d28d9;
            --muted:    #6b6880;
            --sub:      #9391a8;
            --text:     #f0eeff;
            --font:     'Manrope', system-ui, sans-serif;
            --mono:     'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        ul { list-style: none; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.35); border-radius: 3px; }

        .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }

        /* Gradient text - original beautiful gradient */
        .grad {
            background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 40%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: #a78bfa;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.35);
        }

        /* Section label pill */
        .pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px; border-radius: 100px;
            background: rgba(124,58,237,0.08);
            border: 1px solid rgba(124,58,237,0.2);
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
            color: var(--p400); text-transform: uppercase;
            margin-bottom: 24px;
        }
        .pill-dot { width: 6px; height: 6px; background: var(--p400); border-radius: 50%; }

        /* ── Buttons ─────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 32px; border-radius: 16px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            border: 1px solid transparent;
            transition: all 250ms cubic-bezier(0.2, 0, 0, 1);
        }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(124,58,237,0.3); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
            border-color: rgba(255,255,255,0.2);
        }

        /* ── NAVBAR ─────────────────────────────────────── */
        .nav {
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 999; padding: 18px 0;
            background: rgba(10,10,15,0.82);
            border-bottom: 1px solid transparent;
            transition: all 250ms ease;
        }
        .nav.scrolled { padding: 12px 0; background: rgba(10,10,15,0.95); border-bottom-color: var(--border); }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; }

        .nav-logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em;
        }
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; }
        .nav-logo-dot {
            width: 8px; height: 8px; background: var(--p400); border-radius: 50%;
            margin-left: 2px; margin-bottom: 1px;
        }

        .nav-links { display: flex; gap: 32px; }
        .nav-links a { color: var(--muted); font-size: 0.9rem; font-weight: 500; transition: color 150ms; }
        .nav-links a:hover { color: var(--text); }

        .nav-cta { display: flex; gap: 10px; align-items: center; }

        .nav-invite {
            padding: 8px 18px; border-radius: 9px;
            background: linear-gradient(135deg, var(--p600), var(--p500));
            color: #fff; font-size: 0.87rem; font-weight: 600;
            transition: opacity 200ms;
        }
        .nav-invite:hover { opacity: 0.85; }

        .nav-links a.active { color: var(--text); border-bottom: 2px solid var(--p500); padding-bottom: 4px; }

        /* Tab sections */
        .tab-pane { display: none !important; }
        .tab-pane.active { display: block !important; }
        section.hero.tab-pane.active { display: flex !important; }
        .tab-pane.active:not(#home):not(#home-cta) { padding-top: 100px !important; }

        .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; }

        /* ── HERO ─────────────────────────────────────── */
        .hero {
            position: relative; height: 100vh; min-height: 560px;
            display: flex; align-items: center; justify-content: center;
            padding: 80px 0 40px; overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute; top: -50px; left: -50px; right: -50px; bottom: -50px;
            background-image: radial-gradient(circle, rgba(139,92,246,0.12) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
            animation: gridSlide 15s linear infinite;
        }
        @keyframes gridSlide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-28px, -28px); }
        }

        .ambient-orb {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 65%);
            pointer-events: none; z-index: 0;
        }
        .orb-1 {
            width: 800px; height: 800px; top: -200px; left: -200px;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 700px; height: 700px; bottom: -150px; right: -150px;
            animation: floatOrb 18s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.05); }
        }

        .hero-glow {
            position: absolute; top: -5%; left: 50%;
            transform: translateX(-50%);
            width: 1000px; height: 700px;
            background: radial-gradient(ellipse at 50% 30%, rgba(109,40,217,0.18) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-inner {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            gap: 0;
        }

        .hero-heading {
            font-size: clamp(2.4rem, 5.5vw, 4.8rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
            max-width: 820px;
        }

        .hero-float {
            animation: heroFadeGlow 4s ease-in-out infinite;
        }
        @keyframes heroFadeGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.72; }
        }

        .hero-sub {
            font-size: clamp(0.95rem, 1.8vw, 1.1rem);
            color: var(--sub);
            max-width: 560px;
            line-height: 1.65;
            margin-bottom: 28px;
        }

        .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 36px; }

        /* Discord Presence Pill */
        .discord-presence {
            display: inline-flex; align-items: center;
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px; padding: 6px 18px 6px 6px;
            gap: 12px; margin-bottom: 24px;
        }
        .dp-avatar { position: relative; width: 42px; height: 42px; }
        .dp-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .dp-status {
            position: absolute; bottom: -1px; right: -1px;
            width: 12px; height: 12px; background-color: #23a559;
            border: 2px solid #0d0d12; border-radius: 50%;
        }
        .dp-info { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .dp-name {
            font-size: 1.05rem; font-weight: 800; color: #fff;
            display: flex; align-items: center; gap: 6px; line-height: 1.1; margin-bottom: 2px;
        }
        .dp-bot-badge {
            background-color: #5865F2; color: #fff;
            font-size: 0.65rem; font-weight: 700;
            padding: 2px 4px; border-radius: 4px;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .dp-bot-badge i { font-size: 0.55rem; }
        .dp-activity { font-size: 0.85rem; color: #a5b4fc; font-weight: 500; line-height: 1.1; transition: opacity 0.3s ease; }

        /* Floating stat chips */
        .hero-chips {
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
        }
        .chip {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; border-radius: 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            font-size: 0.88rem; font-weight: 600;
            transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1.2), border-color 200ms;
        }
        .chip:hover {
            border-color: var(--p500);
            transform: translateY(-3px) scale(1.03);
        }
        .chip i { color: var(--p400); font-size: 1rem; }
        .chip-val { font-size: 1.1rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
        .chip-label { color: var(--muted); font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── STATS STRIP ─────────────────────── */
        .stats-strip {
            padding: 52px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .stats-strip-inner {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 0;
        }
        .stat-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 0 24px;
            border-right: 1px solid var(--border);
        }
        .stat-item:last-child { border-right: none; }
        .stat-num {
            font-size: 2.6rem; font-weight: 900; letter-spacing: -0.04em;
            line-height: 1; color: var(--text); margin-bottom: 6px;
        }
        .stat-lbl {
            font-size: 0.78rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.08em;
        }

        /* ── FEATURES ─────────────────────────────────────── */
        .features-section { padding: 120px 0; }

        .sec-head { text-align: center; margin-bottom: 70px; }
        .sec-title {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800; letter-spacing: -0.03em;
            line-height: 1.15; margin-bottom: 18px;
        }
        .sec-sub { font-size: 1.05rem; color: var(--sub); max-width: 520px; margin: 0 auto; line-height: 1.7; }

        .feat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .feat-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px 28px;
            position: relative; overflow: hidden;
            transition: all 300ms cubic-bezier(0.2, 0, 0, 1);
        }
        .feat-card::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167,139,250,0.4), transparent);
            opacity: 0; transition: opacity 250ms;
        }
        .feat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
